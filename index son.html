<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>BloodBet</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b0f;--panel:#1e1218;--line:#3d2430;--red:#e0566b;--ember:#ff9a76;--text:#f6eceb;--mute:#b39ba0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.logo{font-weight:800;font-size:21px;letter-spacing:2px;color:var(--red)}
.pills{display:flex;gap:8px}
.pill{background:rgba(30,18,24,.8);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--mute)}
.pill b{color:var(--text)}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2px;background:var(--text);border-radius:50%;opacity:.6;pointer-events:none}
#hint{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--mute);text-align:right;line-height:1.6;pointer-events:none}
#chat{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(380px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px}
#log{max-height:200px;overflow-y:auto;font-size:13px;line-height:1.45;text-shadow:0 1px 2px #000;scrollbar-width:thin;padding-right:6px}
#log div{margin:2px 0}
.sys{color:var(--ember)}.who{font-weight:700;color:var(--red)}
#inp{width:100%;background:rgba(30,18,24,.85);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:10px 14px;font-size:13px;outline:none}
#inp:focus{border-color:var(--red)}
.ov{position:fixed;inset:0;background:rgba(14,7,10,.88);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.box{width:min(480px,100%);max-height:100%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:24px}
h1{font-size:40px;line-height:1;margin:0 0 10px;font-weight:800}
h1 span{color:var(--red)}
h2{margin:0;font-size:22px;font-weight:700}
p{color:var(--mute);margin:0 0 18px;font-size:15px}
input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font-size:16px;margin-bottom:12px}
.btn{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}
.btn:hover{background:var(--ember);color:#2a1010}
.btn.alt{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn.alt:hover{border-color:var(--red);background:var(--panel);color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tabs{display:flex;gap:6px;margin:16px 0 12px}
.tab{flex:1;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font:inherit;font-size:14px}
.tab.on{color:#fff;border-color:var(--red);background:#35161f}
.pane{display:none}.pane.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row input[type=range]{width:55%;accent-color:var(--red)}
.key{min-width:96px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.key.wait{border-color:var(--ember);color:var(--ember)}
.tiny{margin-top:14px;font-size:12px;color:var(--mute)}
.head{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.card.eq{border-color:var(--red)}
.sw{height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px}
.card .btn{margin:0;padding:8px;font-size:13px}
#side{position:fixed;left:16px;top:32%;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tag{background:rgba(30,18,24,.8);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;letter-spacing:1px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.4)}100%{transform:scale(1.25);opacity:1}}
#cross{transition:transform .1s,background .1s}
#modehud{position:fixed;top:56px;left:50%;transform:translateX(-50%);display:none;background:rgba(30,18,24,.88);border:1px solid var(--red);border-radius:14px;padding:8px 18px;font-weight:700;text-align:center;pointer-events:none;max-width:92%}
.tag.on{border-left-color:#5fd68a}
.tag.talk{border-left-color:#5fd68a;box-shadow:0 0 12px rgba(95,214,138,.5)}
#prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);display:none;background:rgba(30,18,24,.92);border:1px solid var(--red);border-radius:14px;padding:10px 18px;font-size:15px;font-weight:600;pointer-events:none;text-align:center;max-width:90%}
#ptr{position:absolute;top:-10px;left:50%;margin-left:-11px;border:11px solid transparent;border-top:20px solid var(--ember);border-bottom:0;z-index:2}
html,body{font-family:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;font-size:16px}
.logo{font-weight:700;font-size:23px;letter-spacing:.3px;color:var(--text);display:flex;align-items:center}
.logo::before{content:"";width:9px;height:9px;background:var(--red);transform:rotate(45deg);margin-right:11px}
.pill{background:rgba(22,13,18,.88);border-radius:6px;padding:5px 12px;font-size:15px}
.ov{background:rgba(10,5,8,.88)}
.box{border-radius:10px;padding:26px;background:#150d11}
h1{font-size:46px;font-weight:700;letter-spacing:-.5px}
p{font-size:16px;line-height:1.45}
input[type=text],#inp{border-radius:8px}
.btn{border-radius:8px;font-weight:600;font-size:16px;transition:background .15s}
.btn:hover{background:#ee6a7e;color:#fff}
.btn.alt:hover{background:#241720}
.tab{border-radius:8px;font-size:15px}.key{border-radius:6px}.card{border-radius:10px}.sw{border-radius:8px}
.tag{border-radius:6px;font-size:15px;font-weight:600;letter-spacing:0}
#prompt,#modehud{border-radius:8px}
.row{font-size:15px}

:root{--fd:"Chakra Petch","Exo 2",system-ui,sans-serif}
html,body{font-family:"Exo 2","Segoe UI",system-ui,sans-serif}
h1,h2,.logo,.btn,.tab,.pill,.tag,.key,.cc,#prompt,#modehud,.nm{font-family:var(--fd)}
h1{letter-spacing:.5px;text-shadow:0 0 28px rgba(224,86,107,.4)}h2{letter-spacing:.6px}
.btn,.tab,.tag{text-transform:uppercase;letter-spacing:.8px;font-size:14px}
.key.on{border-color:var(--red);background:#35161f}.key:disabled{opacity:.5}
.card.eq{box-shadow:0 0 0 1px var(--red)}.rn{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.box.wide{width:min(620px,100%)}
#cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:14px 0}
.cc{background:var(--panel);border:1px solid var(--line);border-top:3px solid;border-radius:10px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;color:var(--text);transition:transform .15s}
.cc:hover{transform:translateY(-3px)}.cc .ci{font-size:38px;width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid}
.bar{display:flex;width:100%;height:5px;border-radius:3px;overflow:hidden;gap:1px}.bar i{display:block;height:100%}
#cpool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:170px;overflow-y:auto;margin:6px 0}
.langsw{display:flex;gap:8px;justify-content:center;margin-top:14px}

#cross{display:none;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff;opacity:.95;box-shadow:0 0 0 1.5px rgba(0,0,0,.7),0 0 6px rgba(255,255,255,.35);z-index:3}
body.play #cross{display:block}
body.play #c{cursor:none}
body.look,body.look *{cursor:none!important}
#lookh{white-space:normal;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);display:none;background:rgba(22,13,18,.88);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13px;color:var(--mute);pointer-events:none;font-family:var(--fd);text-align:center;max-width:92%}

input[type=password]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px 14px;font-size:16px;margin-bottom:12px}
.chip{font:700 10px var(--fd);padding:2px 7px;border-radius:4px;letter-spacing:.9px;vertical-align:1px;display:inline-block;margin-right:6px}
.chip.owner{background:#ffd36b;color:#2a1810}.chip.admin{background:var(--red);color:#fff}
.pill .chip{margin:0}
.sw2{width:14px;height:14px;border-radius:4px;flex:none}
#sb{position:fixed;left:50%;top:13%;transform:translateX(-50%);width:min(540px,92%);display:none;background:rgba(14,7,10,.92);border:1px solid var(--line);border-radius:10px;padding:14px 16px;z-index:4;pointer-events:none;max-height:72%;overflow:hidden}
.sbh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;font-family:var(--fd)}
.sbh b{font-size:18px}.sbh span{font-size:12px;color:var(--mute)}
.sbr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:15px}
.sbr.me{background:rgba(224,86,107,.16)}.sbr .n{flex:1;font-weight:600}.sbr .st{color:var(--mute);font-size:13px}
#ann{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%);display:none;background:rgba(40,16,24,.94);border:1px solid #ffd36b;border-radius:8px;padding:10px 22px;font:700 16px var(--fd);text-align:center;max-width:92%;z-index:4;pointer-events:none}
#ann::before{content:"📢  "}
.asec{margin:16px 0 6px;font:700 12px var(--fd);letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.arow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.arow .nm2{flex:1;font-weight:600}
.mini{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:600 12px var(--fd);cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--red)}.mini.dg{border-color:#7a2a38;color:#ff8a9a}.mini:disabled{opacity:.35;cursor:default}
#fpsc{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);display:none;font:700 12px var(--fd);color:#9fe39f;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:4px;z-index:5;pointer-events:none}
.tabs{flex-wrap:wrap}
.chip.rich{background:#2fbf71;color:#062a14}
.gd{color:var(--ember);font-weight:700;font-size:13px;white-space:nowrap}
.sbr .gd{min-width:84px;text-align:right;font-size:14px}
.sbr .n{display:flex;align-items:center;min-width:0}.sbr .nn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sb{width:min(620px,94%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="top"><div class="logo">BloodBet</div><div class="pills"><div class="pill" id="rpill" style="display:none"></div><div class="pill">◆ <b id="gold">0</b></div><div class="pill"><b id="cnt">1</b> <span data-i="online"></span></div></div></div>

</div></div>

<div class="tabs"><button class="tab on" data-s="c" data-i="sc"></button><button class="tab" data-s="o" data-i="so"></button><button class="tab" data-s="h" data-i="sh"></button><button class="tab" data-s="d" data-i="sd"></button></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('c'),log=$('log'),inp=$('inp'),cnt=$('cnt'),menu=$('menu');
var DEF={master:.7,amb:.5,fx:.7,sens:1,fov:75,mute:false,mth:.04,pttMode:'ptt',music:true,gfx:'high',gfxSet:false,res:100,fps:60,lights:1,glow:true,part:true,lite:false,aa:true,auto:true,showfps:false,lang:String(navigator.language||"tr").slice(0,2)==="tr"?"tr":"en",binds:{fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',run:'ShiftLeft',jump:'Space',dance:'KeyG',shop:'KeyB',wheel:'KeyF',cam:'KeyV',chat:'KeyT',mic:'KeyX',panel:'KeyP'}};
var cfg=JSON.parse(JSON.stringify(DEF));
try{var sv=JSON.parse(localStorage.getItem('kizil-cfg')||'null');if(sv){for(var k in sv)if(k!=='binds')cfg[k]=sv[k];if(sv.binds)for(var b in sv.binds)cfg.binds[b]=sv.binds[b]}}catch(e){}
function save(){try{localStorage.setItem('kizil-cfg',JSON.stringify(cfg))}catch(e){}}
var GFXP={low:{res:60,lights:0,glow:false,part:false,lite:true,aa:false},mid:{res:80,lights:0,glow:true,part:false,lite:false,aa:true},high:{res:100,lights:1,glow:true,part:true,lite:false,aa:true}};
function presetCfg(n){var q=GFXP[n];if(!q)return;for(var k in q)cfg[k]=q[k];cfg.gfx=n}
if(!cfg.gfxSet){cfg.gfxSet=true;try{var ua=navigator.userAgent||'',mob=/Android|iPhone|iPad|iPod|Mobi/i.test(ua),co=navigator.hardwareConcurrency||4,mm=navigator.deviceMemory||4,dp=Math.min(window.devicePixelRatio||1,2),px=innerWidth*innerHeight*dp*dp;
 presetCfg(mob||co<=2||mm<=2?'low':(co<=4||mm<=4||px>3.6e6)?'mid':'high');if(mob)cfg.fps=30}catch(e){}save()}
